# Netlify build settings. vite.config.ts pins nitro's "netlify" preset, which
# writes the client to dist/ and the SSR handler to
# .netlify/functions-internal/server; Netlify picks that function up on its own.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers, the same as public/_headers and src/lib/security-headers.ts (a test checks
# all three). Netlify applies them to the files it serves itself; src/server.ts sends them on
# the pages the server renders.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.autolina.ch; font-src 'self'; media-src 'self'; connect-src 'self' blob: https://connexions.heylemon.app; worker-src 'self' blob:; frame-src https://www.google.com https://www.autolina.ch; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Self-hosted fonts never change under the same name: let browsers keep them.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The 3D model keeps its name when updated: cache it for a day, then revalidate.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
