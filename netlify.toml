# Netlify build settings. vite.config.ts pins nitro's "netlify" preset, which
# writes the client to dist/ and the SSR handler to
# .netlify/functions-internal/server; Netlify picks that function up on its own.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Self-hosted fonts never change under the same name: let browsers keep them.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
